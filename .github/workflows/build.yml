name: Build JavaPro APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DEBUG - List all files
        run: |
          pwd
          ls -la
          echo "--- RECURSIVE ---"
          ls -R | head -100
          echo "--- FIND ZIP ---"
          find . -name "*.zip" 2>/dev/null || echo "NO ZIP FOUND"

      - name: Unzip ANY zip found
        run: |
          for z in $(find . -name "*.zip"); do
            echo "Unzipping $z"
            unzip -o "$z" -d ./unzipped || true
          done
          ls -la
          ls -la ./unzipped 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup SDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true

      - name: Build
        run: |
          GW=$(find . -name "gradlew" -type f | head -1)
          echo "gradlew at $GW"
          if [ -z "$GW" ]; then echo "GRADLEW NOT FOUND!"; find . -maxdepth 4 -type f | head -50; exit 1; fi
          DIR=$(dirname "$GW")
          chmod +x "$GW"
          cd "$DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JavaPro-APK-Fixed
          path: "**/app/build/outputs/apk/debug/*.apk"
