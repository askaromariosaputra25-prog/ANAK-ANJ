name: Build JavaPro APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -name "*.zip" | head -1)
          if [ -n "$ZIP" ]; then unzip -o "$ZIP"; fi
          ls -la

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          yes | sdkmanager --licenses || true

      - name: Fix gradle-wrapper.jar & Build
        run: |
          GW=$(find . -name "gradlew" -type f | head -1)
          DIR=$(dirname "$GW")
          echo "DIR=$DIR"
          
          # FIX JAR HILANG
          if [ ! -f "$DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading wrapper jar..."
            curl -L -o $DIR/gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          fi
          
          chmod +x $GW
          cd $DIR
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JavaPro-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
