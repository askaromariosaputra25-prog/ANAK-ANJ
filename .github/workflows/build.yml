name: Build JavaPro APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -o JavaPro_updated.zip
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Manual (FIX for tools bug)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          DIR=$(find . -maxdepth 2 -name "gradlew" | head -1 | xargs dirname)
          echo "Building in $DIR"
          chmod +x $DIR/gradlew
          cd $DIR
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JavaPro_updated-APK-FIXED
          path: "**/app/build/outputs/apk/debug/*.apk"
